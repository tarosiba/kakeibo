; Copy values via in-game "LLM設定" UI (saved to user://llm_config.cfg).
; Do NOT commit real API keys to git.
;
; Environment variable overrides (optional):
;   AI_COMPANY_API_KEY
;   AI_COMPANY_API_URL
;   AI_COMPANY_MODEL
;   AI_COMPANY_PROVIDER   (ollama | openai)

[llm]
enabled=false
provider=0
api_url=http://127.0.0.1:11434/api/chat
model=llama3.2
api_key=
max_requests_per_session=15
request_timeout_sec=30.0
content_filter_enabled=true
family_safe_mode=true
